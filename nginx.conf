worker_processes auto;

events {
    # Maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # 🚀 PRODUCTION PERFORMANCE & SCALING
    # ------------------------------------------------------------------
    
    # sendfile: Optimized method of sending files from the disk to the network.
    sendfile        on;
    
    # keepalive_timeout: Time a client connection will stay open on the server side.
    keepalive_timeout  65;
    
    # client_max_body_size: Increases the limit for file uploads (Crucial for images/docs).
    client_max_body_size 50M;

    # Gzip: Compresses files (CSS/JS) before sending them to the user.
    # This reduces page load time significantly on mobile/slow networks.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ------------------------------------------------------------------
    # 🔗 BACKEND SERVICE DEFINITIONS (Docker-Compose Service Names)
    # ------------------------------------------------------------------
    
    upstream auth_service {
        server backend-login:5000;
    }

    upstream inventory_service {
        server backend-inventory:5001;
    }

    upstream pretest_service {
        server backend-pretest:5002;
    }

    upstream qc_service {
        server backend-qc-inspection:5003;
    }

    upstream vlt_service {
        server backend-vacuum-leak-test:5004;
    }

    upstream smt_service {
        server backend-smt:5005;
    }

    upstream backend_process_service {
        server backend-backend:5006;
    }

    server {
        listen 80;
        server_name _; 

        # ------------------------------------------------------------------
        # 🔒 SECURITY: BLOCK HIDDEN FILES
        # ------------------------------------------------------------------
        # Prevents anyone from accessing hidden files like .env or .git.
        location ~ /\. {
            deny all;
        }

        # ------------------------------------------------------------------
        # 📂 FRONTEND STATIC FILES (Build artifacts from Vite)
        # ------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Browser Caching: Saves site files in the user's browser for 1 day.
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # ------------------------------------------------------------------
        # 🚦 API GATEWAY ROUTING (Proxying to Microservices)
        # ------------------------------------------------------------------

        # Auth Service: Handles login and uploads
        location /api/auth/ {
            proxy_pass http://auth_service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Inventory Service
        location /api/inventory/ {
            proxy_pass http://inventory_service/api/inventory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Pre-Testing Service
        location /api/pretest/ {
            proxy_pass http://pretest_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Quality Control Service
        location /api/qc/ {
            proxy_pass http://qc_service/api/qc-inspection/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Vacuum Leak Test Service
        location /api/vlt/ {
            proxy_pass http://vlt_service/api/vacuum-leak-test/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SMT Service: Handles serial generation and printing
        location /api/smt/ {
            proxy_pass http://smt_service/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/backend/ {
            proxy_pass http://backend_process_service/api/backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Uploads Folder: Proxied via the Auth service
        location /uploads/ {
            proxy_pass http://auth_service/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
